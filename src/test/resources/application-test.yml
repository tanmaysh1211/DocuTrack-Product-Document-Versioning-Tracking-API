spring:
  datasource:
    url: jdbc:h2:mem:designledger;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  cache:
    type: none

designledger:
  security:
    api-key: test-api-key

management:
  health:
    redis:
      enabled: false
